# Filtri minimi di qualità: scarta film con meno di N triple utili.
min_triples_per_film: 5

# Numero massimo di oggetti per predicato. Usa override per predicati ad alta
# cardinalità per evitare di troncare informazioni rilevanti.
predicate_object_cap: 5
predicate_caps_override:
  dbo:starring: 10
  dbo:director: 3
  dbo:writer: 5

# Config principale DBpedia (usato per l'ordinamento whitelist dei predicati).
dbpedia_config: configs/data/dbpedia.yaml

# Limita i film ai soli titoli nella lingua indicata.
# Aggiungi o modifica gli URI DBpedia ammessi se vuoi includere altre lingue.
allowed_languages:
  - dbr:English_language

# Lunghezza massima delle sequenze (verifica in build, ma il vero cut avviene in tokenizer/model).
max_seq_len: 256

# Split per film (no leakage): somma = 1.0
train_val_test_split: [0.8, 0.1, 0.1]

# Riproducibilità.
shuffle_seed: 13

# Pulizie/normalizzazioni.
deduplicate: true
normalize_prefixes: true

# Filtri sul numero massimo di occorrenze per soggetto/predicato/oggetto.
# Imposta a null per disattivare.
max_subject_freq: null
max_predicate_freq: null
max_object_freq: null

# Percorsi per audit delle frequenze.
frequency_summary_path: data/interim/triple_frequency_summary.json
# Imposta opzionalmente un percorso per il dump completo delle frequenze.
frequency_dump_path: null
