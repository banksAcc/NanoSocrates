# Default multitask training preset mixing RDF/Text tasks with weights 3:3:2:2.
tokenizer_file: "data/vocab/bpe.json"

# datasets
datasets:
  - name: "rdf2text"
    train: "data/processed/rdf2text.train.jsonl"
    val:   "data/processed/rdf2text.val.jsonl"
    weight: 3
  - name: "text2rdf"
    train: "data/processed/text2rdf.train.jsonl"
    val:   "data/processed/text2rdf.val.jsonl"
    weight: 3
  - name: "rdfcomp1"
    train: "data/processed/rdfcomp1.train.jsonl"
    val:   "data/processed/rdfcomp1.val.jsonl"
    weight: 2
  - name: "rdfcomp2"
    train: "data/processed/rdfcomp2.train.jsonl"
    val:   "data/processed/rdfcomp2.val.jsonl"
    weight: 2

# modello
d_model: 256
nhead: 4
enc_layers: 2
dec_layers: 2
ff_dim: 1536
dropout: 0.1
relative_attention_num_buckets: 32
relative_attention_max_distance: 128
layer_norm_epsilon: 1.0e-6
max_len: 256


# training
batch_size: 16
num_epochs: 10
gradient_accumulation_steps: 1
lr: 3e-4
weight_decay: 0.01
save_dir: "checkpoints/multitask_default"
seed: 42
device: "cuda"
num_workers: 4

# opzioni di debug (tutte opzionali)
shuffle_train: true
shuffle_eval: false
limit_train_batches: null
limit_val_batches: null
limit_test_batches: null
