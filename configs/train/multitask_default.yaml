# Default multitask training preset mixing RDF/Text tasks with weights 3:3:2:2.
tokenizer_file: "data/vocab/bpe.json"

# datasets
datasets:
  - name: "rdf2text"
    train: "data/processed/rdf2text.train.jsonl"
    val:   "data/processed/rdf2text.val.jsonl"
    weight: 3
  - name: "text2rdf"
    train: "data/processed/text2rdf.train.jsonl"
    val:   "data/processed/text2rdf.val.jsonl"
    weight: 3
  - name: "rdfcomp1"
    train: "data/processed/rdfcomp1.train.jsonl"
    val:   "data/processed/rdfcomp1.val.jsonl"
    weight: 2
  - name: "rdfcomp2"
    train: "data/processed/rdfcomp2.train.jsonl"
    val:   "data/processed/rdfcomp2.val.jsonl"
    weight: 2

# modello
use_rope: false
use_mla: false
interleave_ratio: 0.0
architecture: "t5"
d_model: 256
nhead: 4
enc_layers: 2
dec_layers: 2
ff_dim: 1536
dropout: 0.1
relative_attention_num_buckets: 32
relative_attention_max_distance: 128
layer_norm_epsilon: 1.0e-6
max_len: 256

# span masking per RDF Completion 1
enable_entity_spans: true
compute_span_metrics: true

# training
batch_size: 16
num_epochs: 10
gradient_accumulation_steps: 1
lr: 3e-4
weight_decay: 0.01
scheduler: "cosine"
warmup_ratio: 0.05
min_lr_ratio: 0.02
save_dir: "checkpoints/multitask_default"
seed: 42
device: "cuda"
num_workers: 4

early_stopping:
  patience: 3
  min_delta: 0.0

wandb:
  mode: "disabled" # disabled, offline, online
  project: "nanosocrates"
  entity: null
  run_name: null
  tags: ["multitask"]
  watch: false
