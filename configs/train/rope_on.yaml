# Multitask ablation preset enabling RoPE positional encodings.

tokenizer_file: "data/vocab/bpe.json"

# datasets (weights inherited from the default 3:3:2:2 schedule)
datasets:
  - name: "rdf2text"
    train: "data/processed/rdf2text.train.jsonl"
    val:   "data/processed/rdf2text.val.jsonl"
    weight: 3
  - name: "text2rdf"
    train: "data/processed/text2rdf.train.jsonl"
    val:   "data/processed/text2rdf.val.jsonl"
    weight: 3
  - name: "rdfcomp1"
    train: "data/processed/rdfcomp1.train.jsonl"
    val:   "data/processed/rdfcomp1.val.jsonl"
    weight: 2
  - name: "rdfcomp2"
    train: "data/processed/rdfcomp2.train.jsonl"
    val:   "data/processed/rdfcomp2.val.jsonl"
    weight: 2

# modello
use_rope: true
use_mla: false
interleave_ratio: 0.0
architecture: "vanilla"
d_model: 384
nhead: 6
enc_layers: 3
dec_layers: 3
ff_dim: 1536
dropout: 0.1
relative_attention_num_buckets: 32
relative_attention_max_distance: 128
layer_norm_epsilon: 1.0e-6
max_len: 256

# span masking (disabilitato per esperimento RoPE)
enable_entity_spans: false
compute_span_metrics: false

# training
batch_size: 16
num_epochs: 10
gradient_accumulation_steps: 1
lr: 3e-4
weight_decay: 0.01
warmup_steps: 2000
save_dir: "checkpoints/rope_multitask"
seed: 42

device: "cuda"
num_workers: 4

early_stopping:
  patience: 3
  min_delta: 0.0

wandb:
  mode: "online" # disabled, offline, online
  project: "nanosocrates"
  entity: null
  run_name: null
  tags: ["rope", "multitask"]
  watch: false
