model_alias: "multitask_default"
checkpoint: "overfit.pt"  # usa --override checkpoint=... oppure aggiorna CHECKPOINT_ALIASES

tokenizer_file: "data/vocab/bpe.json"
max_len: 100
batch_size: 16
num_workers: 4
device: "cuda"
output_json: "reports/multitask_default_eval.json"

generation_params:
  max_new_tokens: 256
  min_new_tokens: 1
  debug_generation: true
  use_beam_search: true
  beam_size: 4
  length_penalty: 1.0
  early_stopping: true
  no_repeat_ngram_size: 3
  repetition_penalty: 1.1

# path split per task
tasks:
  text2rdf:
    val: "data/processed/text2rdf.val.jsonl"
    test: "data/processed/text2rdf.test.jsonl"
  rdf2text:
    val: "data/processed/rdf2text.val.jsonl"
    test: "data/processed/rdf2text.test.jsonl"
  rdfcomp1:
    val: "data/processed/rdfcomp1.val.jsonl"
    test: "data/processed/rdfcomp1.test.jsonl"
  rdfcomp2:
    val: "data/processed/rdfcomp2.val.jsonl"
    test: "data/processed/rdfcomp2.test.jsonl"

wandb:
  mode: "disabled"

preview:
  limit: 5          # massimo numero di esempi mostrati per ciascun task
  per_task: false  # se false applica il limite sull'intero dataset
  output_dir: "reports/previews"  # (facoltativo) salva i record su disco
